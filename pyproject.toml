[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmbox"
version = "0.2.0"
description = "Python orchestration for coding agents in local, container, and cloud sandboxes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "SwarmClaw AI" }]
keywords = ["ai", "agent", "coding-agent", "sandbox", "docker", "podman", "worktree"]
dependencies = []

[project.optional-dependencies]
vercel = ["vercel>=0.1.0"]
daytona = ["daytona-sdk>=0.1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/swarmclawai/swarmbox"
Repository = "https://github.com/swarmclawai/swarmbox"

[project.scripts]
swarmbox = "swarmbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarmbox = ["templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
